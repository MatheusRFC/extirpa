# Temporário: por que o executável não inicia (0xc000007b). Este branch é apagado depois.
name: diag
on:
  push:
    branches: [ci-teste-real]
permissions:
  contents: write
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build variants with MSVC and the SDK libraries
        shell: cmd
        continue-on-error: true
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" > nul
          mkdir results
          cd diag
          (
          echo int main(void^) { return 7; }
          ) > crt.c
          cl /nologo crt.c /Fe:m4-msvc-crt.exe
          cl /nologo /GS- hello.c /Fe:m1-msvc-nocrt.exe /link /entry:WinMainCRTStartup /nodefaultlib /subsystem:windows kernel32.lib
          link /nologo hello.obj kernel32-dlltool.lib /entry:WinMainCRTStartup /nodefaultlib /subsystem:windows /out:m2-msvclink-dlltoollib.exe
          "C:\Program Files\LLVM\bin\lld-link.exe" /nologo hello.obj kernel32.lib /entry:WinMainCRTStartup /nodefaultlib /subsystem:windows /out:m3-lld-sdklib.exe
          dir *.exe
      - name: Start each variant
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Get-ProcessMitigation -System | Out-String -Width 300 | Out-File results\mitigation.txt
          Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint m);'
          [W.K]::SetErrorMode(0x8003) | Out-Null
          & {
            foreach ($f in @(Get-ChildItem diag\*.exe) + @(Get-Item bin\extirpa.exe, bin\extirpa-selftest.exe)) {
              $psi = New-Object System.Diagnostics.ProcessStartInfo $f.FullName
              $psi.UseShellExecute = $false
              try {
                $p = [System.Diagnostics.Process]::Start($psi)
                if ($p.WaitForExit(20000)) { "{0}: saiu com 0x{1:X8}" -f $f.Name, $p.ExitCode }
                else { "{0}: rodando depois de 20 s (iniciou)" -f $f.Name; $p.Kill() }
              } catch { "{0}: erro ao iniciar: {1}" -f $f.Name, $_ }
            }
          } *>&1 | Tee-Object -FilePath results\diag-start.txt
      - name: Loader snaps
        shell: pwsh
        continue-on-error: true
        run: |
          $dbg = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          & {
            "debuggers: $(Test-Path "$dbg\cdb.exe")"
            if (Test-Path "$dbg\cdb.exe") {
              & "$dbg\gflags.exe" /i extirpa.exe +sls
              $p = Start-Process -FilePath "$dbg\cdb.exe" -ArgumentList '-g','-G','-logo',"$PWD\results\cdb.txt",'-c','"g;q"',"$PWD\bin\extirpa.exe" -PassThru
              if (-not $p.WaitForExit(90000)) { "cdb ainda rodando depois de 90 s"; $p | Stop-Process -Force; Get-Process extirpa -ErrorAction SilentlyContinue | Stop-Process -Force }
              & "$dbg\gflags.exe" /i extirpa.exe -sls
            }
          } *>&1 | Tee-Object -FilePath results\diag-snaps.txt
      - name: dumpbin
        shell: pwsh
        continue-on-error: true
        run: |
          $db = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & { "dumpbin: $db"; if ($db) { & $db /nologo /headers /imports /loadconfig bin\extirpa.exe } } *>&1 | Out-File results\dumpbin.txt
      - name: Application event log
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WinEvent -LogName Application -MaxEvents 60 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'extirpa|SideBySide|0xc000007b' } |
            Format-List TimeCreated, ProviderName, Id, Message | Out-File -Width 400 results\events.txt
      - name: Commit results
        if: always()
        shell: pwsh
        run: |
          git config user.name "extirpa-ci"
          git config user.email "extirpa-ci@users.noreply.github.com"
          git add results
          git commit -m "diag results [skip ci]"
          git pull --rebase origin ci-teste-real
          git push origin HEAD:ci-teste-real
