# Temporário: teste com programas reais num Windows limpo. Este branch é apagado depois.
name: realtest
on:
  push:
    branches: [ci-teste-real]
permissions:
  contents: write
jobs:
  realtest:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force results-rt -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force results-rt | Out-Null
          & { Get-Command clang, lld-link, llvm-rc, llvm-dlltool, llvm-lib, python -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize | Out-String -Width 300
              [Environment]::OSVersion | Out-String
              whoami /groups | Select-String "Mandatory" | Out-String
              "elevated: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
              Get-Process -Id $PID | Select-Object SessionId | Out-String
          } *>&1 | Tee-Object -FilePath results-rt\steps.txt -Append
      - name: Build from source on Windows
        shell: pwsh
        continue-on-error: true
        run: |
          python tools/build.py all *>&1 | Tee-Object -FilePath results-rt\build-windows.txt
      - name: Start the release executable
        shell: pwsh
        continue-on-error: true
        run: |
          & {
            "sha256 extirpa.exe: " + (Get-FileHash bin\extirpa.exe -Algorithm SHA256).Hash
            $p = Start-Process -FilePath bin\extirpa.exe -PassThru
            Start-Sleep 10
            if ($p.HasExited) { "extirpa.exe SAIU: 0x{0:X8}" -f $p.ExitCode }
            else {
              "extirpa.exe rodando: " + (Get-Process -Id $p.Id).MainWindowTitle + ", memória privada " + [int]((Get-Process -Id $p.Id).PrivateMemorySize64 / 1KB) + " KB"
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$PWD\results-rt\release-exe.png")
              $p.CloseMainWindow() | Out-Null
              if (-not $p.WaitForExit(10000)) { "não fechou pela janela"; $p | Stop-Process -Force } else { "fechou pela janela: código $($p.ExitCode)" }
            }
          } *>&1 | Tee-Object -FilePath results-rt\steps.txt -Append
      - name: General self-test
        shell: pwsh
        continue-on-error: true
        run: |
          & {
            try {
              $p = Start-Process -FilePath bin\extirpa-selftest.exe -ArgumentList '--selftest' -PassThru
              if (-not $p.WaitForExit(600000)) {
                "SELFTEST TRAVADO depois de 10 min: captura da tela e encerramento"
                Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
                [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
                $bmp.Save("$PWD\results-rt\hang.png")
                Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object Name, Id, MainWindowTitle | Out-String
                $p | Stop-Process -Force
              } else { "selftest exit: $($p.ExitCode)" }
            } catch { "selftest start error: $_" }
          } *>&1 | Tee-Object -FilePath results-rt\steps.txt -Append
      - name: Snapshot before installing
        shell: pwsh
        continue-on-error: true
        run: |
          & { try { $t = Get-Date; $p = Start-Process -FilePath bin\extirpa-selftest.exe -ArgumentList '--snapshot-save','C:\snap.bin' -PassThru
                    if (-not $p.WaitForExit(1200000)) { "SNAPSHOT TRAVADO depois de 20 min"; $p | Stop-Process -Force }
                    else { "snapshot exit: $($p.ExitCode) em $([int]((Get-Date) - $t).TotalSeconds) s" } }
              catch { "snapshot error: $_" } } *>&1 | Tee-Object -FilePath results-rt\steps.txt -Append
      - name: Install real programs
        shell: pwsh
        continue-on-error: true
        run: |
          choco install notepadplusplus vlc keepass filezilla winscp 7zip audacity putty.install everything sumatrapdf.install greenshot irfanview -y --no-progress *>&1 | Select-Object -Last 40 | Tee-Object -FilePath results-rt\steps.txt -Append
      - name: Use each program once (creates user data)
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "$env:ProgramFiles\VideoLAN\VLC\vlc.exe",
            "$env:ProgramFiles\PuTTY\putty.exe",
            "$env:ProgramFiles\PuTTY\puttygen.exe",
            "${env:ProgramFiles}\KeePass Password Safe 2\KeePass.exe",
            "${env:ProgramFiles(x86)}\KeePass Password Safe 2\KeePass.exe",
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "${env:ProgramFiles(x86)}\WinSCP\WinSCP.exe",
            "$env:ProgramFiles\WinSCP\WinSCP.exe",
            "$env:ProgramFiles\7-Zip\7zFM.exe",
            "$env:ProgramFiles\Audacity\Audacity.exe",
            "$env:ProgramFiles\Everything\Everything.exe",
            "$env:ProgramFiles\SumatraPDF\SumatraPDF.exe",
            "$env:LOCALAPPDATA\SumatraPDF\SumatraPDF.exe",
            "$env:ProgramFiles\Greenshot\Greenshot.exe",
            "$env:ProgramFiles\IrfanView\i_view64.exe")
          foreach ($a in $apps) { if (Test-Path $a) { "start $a"; Start-Process $a; Start-Sleep 6 } }
          Start-Sleep 5
          Get-Process notepad++, vlc, putty, puttygen, KeePass, filezilla, WinSCP, 7zFM, Audacity, Everything, SumatraPDF, Greenshot, i_view64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
      - name: Uninstall with EXTIRPA and measure what is left
        shell: pwsh
        continue-on-error: true
        run: |
          & { try { $p = Start-Process -FilePath bin\extirpa-selftest.exe -ArgumentList '--realtest','C:\snap.bin','Notepad++','"VLC media player"','KeePass','FileZilla','WinSCP','7-Zip','Audacity','PuTTY','Everything','SumatraPDF','Greenshot','IrfanView' -PassThru
                    if (-not $p.WaitForExit(2400000)) { "REALTEST TRAVADO"; $p | Stop-Process -Force } else { "realtest exit: $($p.ExitCode)" } }
              catch { "realtest error: $_" } } *>&1 | Tee-Object -FilePath results-rt\steps.txt -Append
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "$env:LOCALAPPDATA\EXTIRPA\selftest\*" results-rt\ -ErrorAction SilentlyContinue
          Copy-Item -Force "$env:LOCALAPPDATA\EXTIRPA\extirpa.log" results-rt\ -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\EXTIRPA\Backups" -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-File results-rt\backups.txt
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem results-rt -Recurse -Filter *.bmp | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$','.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose(); Remove-Item $_.FullName }
          git config user.name "extirpa-ci"
          git config user.email "extirpa-ci@users.noreply.github.com"
          git add results-rt
          git commit -m "realtest results [skip ci]"
          git pull --rebase origin ci-teste-real
          git push origin HEAD:ci-teste-real
