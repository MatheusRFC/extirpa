# Temporário: teste com programas reais num Windows limpo. Este branch é apagado depois.
name: realtest
on:
  push:
    branches: [ci-teste-real]
permissions:
  contents: write
jobs:
  realtest:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: pwsh
        run: |
          Get-Command clang, lld-link, llvm-rc, llvm-dlltool, llvm-lib -ErrorAction SilentlyContinue | Format-Table Name, Source
          [Environment]::OSVersion
          whoami /groups | Select-String "High Mandatory"
      - name: General self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\extirpa-selftest.exe -ArgumentList '--selftest' -Wait -PassThru
          "exit: $($p.ExitCode)"
      - name: Snapshot before installing
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\extirpa-selftest.exe -ArgumentList '--snapshot-save','C:\snap.bin' -Wait -PassThru
          "exit: $($p.ExitCode)"
          Get-Content "$env:LOCALAPPDATA\EXTIRPA\selftest\snapshot.txt"
      - name: Install real programs
        shell: pwsh
        run: |
          choco install notepadplusplus vlc putty keepass filezilla winscp -y --no-progress | Select-Object -Last 30
      - name: Use each program once (creates user data)
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "$env:ProgramFiles\VideoLAN\VLC\vlc.exe",
            "$env:ProgramFiles\PuTTY\putty.exe",
            "${env:ProgramFiles}\KeePass Password Safe 2\KeePass.exe",
            "${env:ProgramFiles(x86)}\KeePass Password Safe 2\KeePass.exe",
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "${env:ProgramFiles(x86)}\WinSCP\WinSCP.exe",
            "$env:ProgramFiles\WinSCP\WinSCP.exe")
          foreach ($a in $apps) { if (Test-Path $a) { "start $a"; Start-Process $a; Start-Sleep 6 } }
          Start-Sleep 5
          Get-Process notepad++, vlc, putty, KeePass, filezilla, WinSCP -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
      - name: Uninstall with EXTIRPA and measure what is left
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\extirpa-selftest.exe -ArgumentList '--realtest','C:\snap.bin','Notepad++','VLC media player','PuTTY','KeePass','FileZilla','WinSCP' -Wait -PassThru
          "exit: $($p.ExitCode)"
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item -Recurse -Force "$env:LOCALAPPDATA\EXTIRPA\selftest\*" results\ -ErrorAction SilentlyContinue
          Copy-Item -Force "$env:LOCALAPPDATA\EXTIRPA\extirpa.log" results\ -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\EXTIRPA\Backups" -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-File results\backups.txt
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem results -Recurse -Filter *.bmp | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$','.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose(); Remove-Item $_.FullName }
          git config user.name "extirpa-ci"
          git config user.email "extirpa-ci@users.noreply.github.com"
          git add results
          git commit -m "realtest results [skip ci]"
          git push origin HEAD:ci-teste-real
